AWSTemplateFormatVersion: 2010-09-09
Description: Create a role for us to assume and create a resource we'll have access to.
Parameters:
  BucketName:
    Type: String
    Default: "my-habib-bucket"
Resources:
  StsRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::376129873245:user/sts-machine-user"
            Action:
              - "sts:AssumeRole"
      Path: /
      Policies:
        - PolicyName: s3access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: ["arn:aws:s3:::*", !Sub "arn:aws:s3:::${BucketName}", !Sub "arn:aws:s3:::${BucketName}/*"]
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

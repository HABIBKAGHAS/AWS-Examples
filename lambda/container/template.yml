AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Resources:
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-resource-function-examples
  InlineLambda:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ./
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
    Events:
      MSKEvent:
        Type: MSK
        Properties:
          StartingPosition: LATEST
          Stream: arn:aws:kafka:us-east-1:012345678012:cluster/exampleClusterName/abcdefab-1234-abcd-5678-cdef0123ab01-2
          Topics:
            - MyTopic
